<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Thank you — a26 Products</title>

  <!-- Auto-redirect to Calendly after 4 seconds -->
  <meta http-equiv="refresh" content="4;url=https://calendly.com/a26companies/15min" />

  <!-- OPTIONAL: If your site has a favicon -->
  <link rel="icon" type="image/png" href="/favicon.png" />

  <!-- OPTIONAL: If your site uses your existing CSS -->
  <link rel="stylesheet" href="/lux.css" />

  <!-- =========================
       GOOGLE TAG (gtag.js)
       Replace G-XXXXXXXXXX with your real GA4 Measurement ID
       (You already mentioned: G-WVWP0EBRBC)
  ========================== -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-WVWP0EBRBC"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-WVWP0EBRBC');
  </script>

  <!-- =========================
       GOOGLE ADS CONVERSION EVENT (PLACEHOLDER)
       After you create the conversion in Google Ads, it will give you:
       - AW-CONVERSION_ID
       - conversion_label
       Paste those into the snippet below.
       
       EXAMPLE ONLY (do not leave placeholders):
       gtag('config','AW-123456789');
       gtag('event','conversion',{'send_to':'AW-123456789/AbCdEfGhIjKlMnOpQr'});
  ========================== -->
  <script>
    // 1) Add your Google Ads base config line (AW-XXXXXXX)
    // gtag('config', 'AW-XXXXXXXXXX');

    // 2) Fire the conversion on page load
    // gtag('event', 'conversion', {
    //   'send_to': 'AW-XXXXXXXXXX/XXXXXXXXXXXXXXX'
    // });
  </script>

  <style>
    /* Simple, clean fallback styling if your lux.css doesn't load */
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background:#fff;
      color:#111;
    }
    .wrap{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:32px;
      box-sizing:border-box;
    }
    .card{
      max-width:720px;
      width:100%;
      border:1px solid rgba(0,0,0,.08);
      border-radius:16px;
      padding:28px;
      box-shadow:0 8px 30px rgba(0,0,0,.06);
    }
    h1{margin:0 0 10px 0; font-size:28px; line-height:1.2;}
    p{margin:0 0 14px 0; font-size:16px; line-height:1.5; color:rgba(0,0,0,.78);}
    .small{font-size:13px; color:rgba(0,0,0,.6);}
    a{color:#0b57d0;}
    .btn{
      display:inline-block;
      margin-top:10px;
      padding:12px 14px;
      border-radius:12px;
      background:#111;
      color:#fff;
      text-decoration:none;
      font-weight:600;
    }
    .btn:hover{opacity:.9;}
  </style>
</head>

<body>
  <div class="wrap">
    <div class="card">
      <h1>Thanks — we got your request.</h1>
      <p>You’ll be redirected to book a quick 15-minute call in a moment.</p>
      <p class="small">
        If you’d rather not book right now, no problem — we’ll follow up by email using the details you submitted.
      </p>

      <a class="btn" href="https://calendly.com/a26companies/15min">Book the 15-min call</a>

      <p class="small" style="margin-top:14px;">
        Not redirecting? Use this link:
        <a href="https://calendly.com/a26companies/15min">https://calendly.com/a26companies/15min</a>
      </p>
    </div>
  </div>

  <!-- OPTIONAL: If you want a JS redirect instead of meta refresh, uncomment below
  <script>
    setTimeout(function () {
      window.location.href = "https://calendly.com/a26companies/15min";
    }, 4000);
  </script>
  -->
</body>
</html>
